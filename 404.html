<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PD Playground – Clock Tree Synthesis (CTS) Studio 1.0 Preview</title>
  <script>
    // GitHub Pages Single Page Application (SPA) Deep Link Redirector
    (function () {
      var path = window.location.pathname;
      var repoBase = '/cts-studio-preview';
      if (path.indexOf(repoBase) === 0) {
        var route = path.slice(repoBase.length);
        if (!route || route === '/') {
          window.location.replace(repoBase + '/#/' + window.location.search + window.location.hash);
        } else {
          if (!route.startsWith('/')) route = '/' + route;
          window.location.replace(repoBase + '/#' + route + window.location.search + window.location.hash);
        }
      } else {
        window.location.replace('/cts-studio-preview/#/studio/cts');
      }
    })();
  </script>
</head>
<body style="background: #0b0f19; color: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
  <div style="padding: 2.5rem; background: #111827; border: 1px solid #1f2937; border-radius: 14px; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">🌲</div>
    <h2 style="color: #38bdf8; margin-top: 0; font-size: 1.4rem;">Opening CTS Studio 1.0...</h2>
    <p style="font-size: 0.95rem; line-height: 1.5; color: #cbd5e1;">Redirecting you to the Clock Tree Synthesis CAD Studio &amp; Curriculum...</p>
    <p style="font-size: 0.85rem; color: #64748b; margin-top: 1.5rem;">
      If you are not redirected automatically, <a href="/cts-studio-preview/#/studio/cts" style="color: #38bdf8; font-weight: 600; text-decoration: underline;">click here to enter CTS Studio</a>.
    </p>
  </div>
</body>
</html>

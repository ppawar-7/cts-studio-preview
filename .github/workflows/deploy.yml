name: Deploy CTS Studio Preview to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification test suite
        run: npm test -- --run

      - name: Build production bundle
        env:
          VITE_BASE_PATH: /cts-studio-preview/
        run: |
          npm run build
          touch dist/.nojekyll
          mkdir -p dist/studio/cts
          cp dist/index.html dist/studio/cts/index.html
          mkdir -p dist/explore/studio/cts
          cp dist/index.html dist/explore/studio/cts/index.html
          mkdir -p dist/kingdom/cts
          cp dist/index.html dist/kingdom/cts/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
